name: Go CI and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      
      - name: Format check
        run: |
          go fmt ./...
          git diff --exit-code -- '*.go' || (echo "Code not formatted, please run 'go fmt ./...'" && exit 1)
      
      - name: Vet
        run: go vet ./...
      
      - name: Test with coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
          verbose: true

  build-and-release:
    name: Cross-Platform Build & Release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      
      - name: Build Binaries for All Platforms
        run: |
          mkdir -p dist
          
          # Linux AMD64
          echo "Building for Linux AMD64..."
          GOOS=linux GOARCH=amd64 go build -o dist/easyedit-linux-amd64 .
          
          # Linux ARM64
          echo "Building for Linux ARM64..."
          GOOS=linux GOARCH=arm64 go build -o dist/easyedit-linux-arm64 .
          
          # macOS AMD64
          echo "Building for macOS AMD64..."
          GOOS=darwin GOARCH=amd64 go build -o dist/easyedit-darwin-amd64 .
          
          # macOS ARM64 (M1/M2)
          echo "Building for macOS ARM64..."
          GOOS=darwin GOARCH=arm64 go build -o dist/easyedit-darwin-arm64 .
          
          # Windows AMD64
          echo "Building for Windows AMD64..."
          GOOS=windows GOARCH=amd64 go build -o dist/easyedit-windows-amd64.exe .
          
          # Generate SHA256 checksums
          echo "Generating checksums..."
          cd dist && sha256sum * > checksums.txt
          
          echo "Build complete. Files:"
          ls -lh
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
